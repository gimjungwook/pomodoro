<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 1-bit Pixel Art Tomato (Pomodoro) -->
  <!-- 16x16 grid scaled to 512x512 -->
  <style>
    rect { fill: #000000; }
  </style>

  <!-- Stem (top) -->
  <rect x="224" y="0" width="64" height="32"/>

  <!-- Leaf -->
  <rect x="160" y="32" width="32" height="32"/>
  <rect x="192" y="32" width="128" height="32"/>
  <rect x="320" y="32" width="32" height="32"/>

  <!-- Top of tomato -->
  <rect x="128" y="64" width="256" height="32"/>

  <!-- Body rows -->
  <rect x="96" y="96" width="320" height="32"/>
  <rect x="64" y="128" width="384" height="32"/>
  <rect x="64" y="160" width="384" height="32"/>
  <rect x="32" y="192" width="448" height="32"/>
  <rect x="32" y="224" width="448" height="32"/>
  <rect x="32" y="256" width="448" height="32"/>
  <rect x="32" y="288" width="448" height="32"/>
  <rect x="32" y="320" width="448" height="32"/>
  <rect x="64" y="352" width="384" height="32"/>
  <rect x="64" y="384" width="384" height="32"/>
  <rect x="96" y="416" width="320" height="32"/>
  <rect x="128" y="448" width="256" height="32"/>
  <rect x="192" y="480" width="128" height="32"/>
</svg>
